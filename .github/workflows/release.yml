name: Release

# Publishes @skylivellc/lienzo-core and @skylivellc/lienzo-editor to npm when a
# vX.Y.Z tag is pushed. Publishing from Actions lets npm attach provenance;
# pnpm only generates it with --provenance, publishConfig.provenance is ignored.
# Packagist picks up the same tag for skylive/lienzo on its own.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the tag matches the package versions
        run: |
          for package in core editor; do
            test "v$(node -p "require('./packages/$package/package.json').version")" = "$GITHUB_REF_NAME"
          done
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # One package at a time: a recursive publish hides which one failed, and
      # has left the two packages on different versions more than once. npm
      # answers 409 when a version is already there, which is not a failure.
      - name: Publish each package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in core editor; do
            name="@skylivellc/lienzo-$package"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"; continue
            fi
            # From inside the package: a workspace filter has published nothing
            # and still exited 0, which is how the two drifted apart.
            for attempt in 1 2 3; do
              (cd "packages/$package" && pnpm publish --access public --no-git-checks --provenance) || true
              for wait in $(seq 1 10); do
                npm view "$name@$version" version > /dev/null 2>&1 && break 2
                sleep 6
              done
              echo "$name@$version is not on npm yet, trying again"
            done
            npm view "$name@$version" version > /dev/null 2>&1 \
              || { echo "::error::$name@$version never reached npm"; exit 1; }
          done
      # Fails the release if npm stored a package without its provenance attestation.
      - name: Check provenance was attached
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in core editor; do
            url="https://registry.npmjs.org/-/npm/v1/attestations/@skylivellc%2flienzo-$package@$version"
            for attempt in $(seq 1 18); do
              curl -sf "$url" > /dev/null && continue 2
              sleep 10
            done
            echo "No provenance attestation for @skylivellc/lienzo-$package@$version"; exit 1
          done
